version: '3.8'

services:
  app:
    image: ghcr.io/ivanalehin/catty-reminders:latest
    container_name: catty-app
    ports:
      - "8181:8181"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: reminders_db
      DB_USER: app_user
      DB_PASSWORD: app_password_here
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: catty-db
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password_here
      MYSQL_DATABASE: reminders_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password_here
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
