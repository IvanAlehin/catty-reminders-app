name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker container to VM
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          port: 2422
          username: ivan
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Вход в GHCR
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/ivanalehin/catty-reminders:latest

            docker stop catty-reminders || true
            docker rm catty-reminders || true

            docker run -d \
              --name catty-reminders \
              --restart unless-stopped \
              -p 8181:8181 \
              ghcr.io/ivanalehin/catty-reminders:latest

            echo "Deployment completed"
            echo "App available at http://app.alehin.course.prafdin.ru"
