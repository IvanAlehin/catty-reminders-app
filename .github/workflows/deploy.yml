name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove .git folder (not needed on VM)
        run: rm -rf .git

      - name: Copy files to VM
        uses: appleboy/scp-action@v1
        with:
          host: course.prafdin.ru
          port: 2422
          username: ivan
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/ivan/app"
          strip_components: 1
          overwrite: true

      - name: Install dependencies and restart app
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          port: 2422
          username: ivan
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ivan/app
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart catty-reminders
            echo "Deployment successful"
