name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -p 2422 course.prafdin.ru >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: course.prafdin.ru
          port: 2422
          username: ivan
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/ivan/app/"
          overwrite: true 

      - name: Deploy with Docker Compose to VM
        run: |
          echo "Starting Docker Compose deployment..."

          ssh -i ~/.ssh/vm_key -p 2422 -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            ivan@course.prafdin.ru 'bash -l -c "
            set -e # Завершить скрипт при первой ошибке

            cd /home/ivan/app || { echo \"Failed to cd to /home/ivan/app\"; exit 1; }
            echo \"Current directory: $(pwd)\"
            echo \"Contents of /home/ivan/app:\"
            ls -la

            if [ ! -f docker-compose.yml ]; then
                echo \"Error: docker-compose.yml not found in /home/ivan/app\"
                exit 1
            fi
            echo \"Found docker-compose.yml\"

            echo \"Logging in to GHCR...\"
            echo \"${{ secrets.GITHUB_TOKEN }}\" | docker login ghcr.io -u \"${{ github.actor }}\" --password-stdin || { echo \"Docker login failed\"; exit 1; }

            echo \"Pulling latest images...\"
            docker compose -f docker-compose.yml pull || { echo \"Docker compose pull failed\"; exit 1; }

            echo \"Stopping and removing old containers...\"
            docker compose -f docker-compose.yml down || { echo \"Docker compose down failed\"; exit 1; }

            echo \"Starting new containers with Docker Compose...\"
            docker compose -f docker-compose.yml up -d || { echo \"Docker compose up failed\"; exit 1; }

            echo \"Cleaning up...\"
            docker image prune -f

            echo \"Docker Compose deployment completed!\"
            echo \"Containers status:\"
            docker compose -f docker-compose.yml ps
            echo \"Application: http://app.alehin.course.prafdin.ru\"
            "'

