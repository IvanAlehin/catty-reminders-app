name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -p 2422 course.prafdin.ru >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose to VM
        run: |
          echo "Starting Docker Compose deployment..."

          ssh -i ~/.ssh/vm_key -p 2422 -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            ivan@course.prafdin.ru "
              echo 'Creating necessary directories...'
              mkdir -p /home/ivan/app
              echo 'Directory /home/ivan/app ensured.'
          " || exit 1
          
          scp -i ~/.ssh/vm_key 
              -P 2422 
              -o StrictHostKeyChecking=no \
              ./docker-compose.yml \
              ivan@course.prafdin.ru:/home/ivan/app/docker-compose.yml

          ssh -i ~/.ssh/vm_key 
              -p 2422 
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              ivan@course.prafdin.ru "
              
            echo 'Logging in to GHCR...'
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /home/ivan/app

            echo 'Pulling latest images...'
            docker compose pull

            echo 'Stopping and removing old containers...'
            docker compose down

            echo 'Starting new containers with Docker Compose...'
            docker compose up -d

            echo 'Cleaning up...'
            docker image prune -f

            echo 'Docker Compose deployment completed!'
            echo 'Containers status:'
            docker compose ps
            echo 'Application: http://app.alehin.course.prafdin.ru'
          "
